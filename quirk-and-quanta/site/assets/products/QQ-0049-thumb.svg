<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad_QQ-0049_thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow_QQ-0049_thumb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18243A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Subtle Background -->
  <rect width="400" height="400" fill="url(#bgGrad_QQ-0049_thumb)" />
  
  <!-- Subtle Technical Grid Lines -->
  <g opacity="0.15" stroke="#234E52" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="400" stroke-dasharray="4,4" />
    <line x1="360" y1="0" x2="360" y2="400" stroke-dasharray="4,4" />
    <line x1="0" y1="40" x2="400" y2="40" stroke-dasharray="4,4" />
    <line x1="0" y1="360" x2="400" y2="360" stroke-dasharray="4,4" />
  </g>

  <!-- Category & SKU Header Tag -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="75" height="22" rx="4" fill="#234E52" />
    <text x="37.5" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">QQ-0049</text>
    
    <text x="85" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#319795">Science Gadgets</text>
  </g>

  <!-- Circular Pedestal Ground Shadow -->
  <ellipse cx="200" cy="315" rx="120" ry="22" fill="#E2E8F0" opacity="0.6" filter="url(#shadow_QQ-0049_thumb)" />

  <!-- Distinct Centered Product Vector Illustration -->
  <g id="product-art">
    
        <g transform="translate(120, 100)">
          <!-- Spherical Projector Dome -->
          <circle cx="80" cy="100" r="60" fill="#18243A" stroke="#2B4C7E" stroke-width="3" />
          <!-- Projection Lens Emitter -->
          <circle cx="80" cy="60" r="18" fill="#F4C95D" stroke="#FFFFFF" stroke-width="2" />
          <!-- Beamed Star Field Projection -->
          <polygon points="80,60 20,-10 140,-10" fill="#ECC94B" opacity="0.25" />
          <!-- Pedestal Ring -->
          <path d="M 40 145 Q 80 170 120 145" fill="none" stroke="#D69E2E" stroke-width="6" stroke-linecap="round" />
        </g>
        
  </g>

  <!-- Product Title Label at Bottom -->
  <g transform="translate(200, 368)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#234E52" text-anchor="middle">
      Digital Astronomy Star Projector
    </text>
    <text x="0" y="16" font-family="monospace" font-size="9.5" fill="#718096" text-anchor="middle">
      Quirk &amp; Quanta &#8226; Certified Fictional
    </text>
  </g>
</svg>